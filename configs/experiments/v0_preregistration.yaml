schema_version: 1
seed: 20260814
permutations: 10000
bootstrap_replicates: 10000
alpha: 0.05

protocol:
  id: rgrd-v0-poisonedrag-only-amendment-1
  amendment_id: PA-001-exclude-phantom
  prior_failed_run: rgrd-v0-20260814T190433Z
  amendment_reason: User-directed scope narrowing after Gate 1 found no non-empty optimized Phantom s_gen span.
  claim_boundary: Post-hoc PoisonedRAG-B/W-only evidence; no conclusion may be generalized to Phantom or all modular RAG attacks.
  active_attack_families: [PoisonedRAG-B, PoisonedRAG-W]
  excluded_attack_families: [Phantom]

e00_audit:
  poisonedrag_b: 20
  poisonedrag_w: 20
  phantom_triggered: 20
  phantom_clean_or_untriggered: 20
  required_components: [poisonedrag]
  informational_components: [phantom]

e01_determinism:
  dataset: nq
  queries: 20
  repeats: 2
  attribution_pilot_queries: 5

e02_oracle_mechanism:
  family_success_quotas:
    PoisonedRAG-B: 100
    PoisonedRAG-W: 100
  require_same_final_chunk: true
  require_rerank_survival: true
  require_end_to_end_success: true

e03_intervention_robustness:
  fraction_of_e02: 0.10
  clean_donors_per_span: 8
  minimum_direction_agreement: 0.80
  minimum_exact_ci_lower: 0.70

e04_conformal:
  clean_calibration_nq: 200
  clean_test_nq: 100
  attack_success_quotas:
    PoisonedRAG-B: 50
    PoisonedRAG-W: 50

e05_hard_benign:
  per_group: 100
  groups: [faq, title_body, hotpot_bridge, entity_locator_answer_fact]

e06_joint_gcg:
  dataset: nq
  attack_attempts: 50
  shards: 8
  epochs: 64
  candidates_per_step: 128
  topk_per_coordinate: 16
  tag_length: 32
  oracle_spans_allowed: false
  report_span_iou: false
  persistence_rule: median T_RG exceeds ordinary-clean median and role-identifiable rate is at least 0.50
  weakening_rule: median T_RG is below the pooled modular-attack median

gate_3:
  hypotheses: [H1, H2, H3]
  holm_corrected_p_below: 0.05
  ci_lower_bound_above: 0.0
