[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rgrd-v0"
version = "0.1.0"
description = "Chunk-level retrieval-generation causal role decoupling validation"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pyarrow>=16,<25",
  "pydantic>=2.7,<3",
  "PyYAML>=6.0,<7",
  "scipy>=1.12,<2",
]

[project.optional-dependencies]
models = [
  "accelerate>=0.26,<2",
  "faiss-cpu>=1.8,<2",
  "sentence-transformers>=2.4,<4",
  "torch>=1.13,<3",
  "transformers>=4.40,<5",
]
dev = [
  "pytest>=7.4,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.5,<1",
]

[project.scripts]
rgrd-audit = "rgrd.audit.scan:main"
rgrd-monitor = "rgrd.pipeline.monitor:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["rgrd*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
